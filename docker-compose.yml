# One compose file. Two containers. Nothing else to run.
#
# This used to start a postgres service that the application never connected to:
# Backend/database.py builds its engine from config.DATABASE_PATH (SQLite), so
# the DATABASE_URL below was ignored, the pgdata volume was written to but never
# read, and asyncpg was not even installed. For a deployment that is meant to be
# one command on a customer's own server, a second database server is pure risk.
services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Pick the data source explicitly. "simulator" gives a fully offline demo
      # with no customer credentials in the container at all.
      - CIRA_DATA_SOURCE=${CIRA_DATA_SOURCE:-simulator}
      # Writes stay off until a human turns them on for one tenant.
      - CIRA_ALLOW_WRITES=${CIRA_ALLOW_WRITES:-false}
      - CIRA_SECRET_KEY=${CIRA_SECRET_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CIRA_DB_PATH=/app/db/cira.db
      - CIRA_DATA_DIR=/app/db
    volumes:
      # Chat history, audit log and the offline sandbox live here.
      - cira_data:/app/db

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - BACKEND_ORIGIN=http://backend:8000
    depends_on:
      - backend

volumes:
  cira_data:
